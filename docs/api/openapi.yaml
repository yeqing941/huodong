openapi: 3.0.3
info:
  title: 游戏活动参考库 API
  version: 1.0.0
  description: |
    游戏活动参考库后端接口契约。
    本文件仅定义接口、请求响应模型、权限边界和错误结构，不包含业务实现。
servers:
  - url: /api/v1
    description: API v1

tags:
  - name: Auth
    description: 认证与当前用户权限
  - name: Activities
    description: 活动查询与活动关联数据
  - name: Reviews
    description: AI 标签审核
  - name: Tags
    description: 活动形式标签树管理
  - name: GameTypes
    description: 游戏类型管理
  - name: CrawlerConfigs
    description: 爬虫来源配置管理
  - name: CrawlerTasks
    description: 爬虫任务与失败记录
  - name: AuditLogs
    description: 操作审计日志

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: 登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAuth'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      summary: 退出登录
      responses:
        '204':
          description: 已退出登录
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [Auth]
      summary: 获取当前用户
      responses:
        '200':
          description: 当前用户信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUser'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/permissions:
    get:
      tags: [Auth]
      summary: 获取当前用户权限
      responses:
        '200':
          description: 权限列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePermissions'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /activities:
    post:
      tags: [Activities]
      summary: 新增活动
      description: 运营和超级管理员可手动录入活动；活动必须包含至少一张截图和一个活动形式标签。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateActivityRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseActivity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

    get:
      tags: [Activities]
      summary: 查询活动列表
      description: 不提供全库 dump、批量导出或批量下载能力。
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
        - name: tag_id
          in: query
          description: 活动形式标签 ID，可重复传递以表达多标签筛选
          schema:
            type: array
            items:
              type: string
              format: uuid
          style: form
          explode: true
        - name: game_type_id
          in: query
          schema:
            type: string
            format: uuid
        - name: game_name
          in: query
          schema:
            type: string
            maxLength: 100
        - name: activity_name
          in: query
          schema:
            type: string
            maxLength: 200
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ActivityStatus'
        - name: include_archived
          in: query
          description: 仅超级管理员可设为 true
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 活动分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseActivityPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /activities/{activityId}:
    get:
      tags: [Activities]
      summary: 获取活动详情
      parameters:
        - $ref: '#/components/parameters/ActivityId'
      responses:
        '200':
          description: 活动详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseActivity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Activities]
      summary: 编辑活动
      parameters:
        - $ref: '#/components/parameters/ActivityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateActivityRequest'
      responses:
        '200':
          description: 更新后的活动
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseActivity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /activities/{activityId}/archive:
    post:
      tags: [Activities]
      summary: 归档活动
      parameters:
        - $ref: '#/components/parameters/ActivityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveActivityRequest'
      responses:
        '200':
          description: 已归档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseActivity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /activities/{activityId}/restore:
    post:
      tags: [Activities]
      summary: 恢复活动
      parameters:
        - $ref: '#/components/parameters/ActivityId'
      responses:
        '200':
          description: 已恢复
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseActivity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /activities/{activityId}/related:
    get:
      tags: [Activities]
      summary: 获取相关活动
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 8
            default: 8
      responses:
        '200':
          description: 相关活动列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseActivityList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /activities/stats:
    get:
      tags: [Activities]
      summary: 获取活动统计
      responses:
        '200':
          description: 活动统计
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseActivityStats'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /activities/{activityId}/favorite:
    post:
      tags: [Activities]
      summary: 收藏活动
      parameters:
        - $ref: '#/components/parameters/ActivityId'
      responses:
        '204':
          description: 收藏成功
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Activities]
      summary: 取消收藏活动
      parameters:
        - $ref: '#/components/parameters/ActivityId'
      responses:
        '204':
          description: 取消收藏成功
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /favorites:
    get:
      tags: [Activities]
      summary: 查询我的收藏
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: 我的收藏分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseActivityPage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /activities/batch-import:
    post:
      tags: [Activities]
      summary: 批量录入活动
      description: 提交批量录入文件并返回导入任务结果；不提供全库导出能力。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BatchImportRequest'
      responses:
        '202':
          description: 批量录入已接受
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBatchImport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /activities/batch-import/{importId}:
    get:
      tags: [Activities]
      summary: 查询批量录入结果
      parameters:
        - $ref: '#/components/parameters/ImportId'
      responses:
        '200':
          description: 批量录入结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBatchImport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /activities/{activityId}/screenshots:
    post:
      tags: [Activities]
      summary: 上传活动截图
      parameters:
        - $ref: '#/components/parameters/ActivityId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadScreenshotRequest'
      responses:
        '201':
          description: 截图上传成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseScreenshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /game-types:
    get:
      tags: [GameTypes]
      summary: 查询游戏类型
      parameters:
        - name: include_disabled
          in: query
          description: 仅超级管理员可设为 true
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 游戏类型列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseGameTypeList'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [GameTypes]
      summary: 新增游戏类型
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGameTypeRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseGameType'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /reviews/ai:
    get:
      tags: [Reviews]
      summary: 查询 AI 待审核队列
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: review_status
          in: query
          schema:
            $ref: '#/components/schemas/AIReviewStatus'
        - name: confidence_lt
          in: query
          description: 按 AI 置信度低于指定值筛选，范围 0-1
          schema:
            type: number
            format: float
            minimum: 0
            maximum: 1
      responses:
        '200':
          description: 审核队列
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAIReviewPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /reviews/ai/{reviewId}:
    get:
      tags: [Reviews]
      summary: 获取 AI 审核详情
      parameters:
        - $ref: '#/components/parameters/ReviewId'
      responses:
        '200':
          description: AI 审核详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAIReview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /reviews/ai/{reviewId}/operator-submit:
    post:
      tags: [Reviews]
      summary: 运营提交初审结果
      description: 提交后进入 pending_admin_review，不得直接变为正式活动。
      parameters:
        - $ref: '#/components/parameters/ReviewId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperatorReviewSubmitRequest'
      responses:
        '200':
          description: 已提交管理员确认
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAIReview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /reviews/ai/{reviewId}/return:
    post:
      tags: [Reviews]
      summary: 退回 AI 审核记录
      parameters:
        - $ref: '#/components/parameters/ReviewId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewReturnRequest'
      responses:
        '200':
          description: 已退回
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAIReview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /reviews/ai/{reviewId}/admin-confirm:
    post:
      tags: [Reviews]
      summary: 管理员最终确认 AI 标签
      parameters:
        - $ref: '#/components/parameters/ReviewId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminReviewConfirmRequest'
      responses:
        '200':
          description: 已确认并转为正式活动
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAIReview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /reviews/ai/{reviewId}/admin-correct:
    post:
      tags: [Reviews]
      summary: 管理员修正 AI 标签
      parameters:
        - $ref: '#/components/parameters/ReviewId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminReviewCorrectRequest'
      responses:
        '200':
          description: 已修正并确认
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAIReview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /tags/tree:
    get:
      tags: [Tags]
      summary: 获取标签树
      parameters:
        - name: include_disabled
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 三级标签树
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTagTree'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /tags:
    post:
      tags: [Tags]
      summary: 新增标签
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTagRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /tags/{tagId}:
    patch:
      tags: [Tags]
      summary: 编辑标签
      parameters:
        - $ref: '#/components/parameters/TagId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTagRequest'
      responses:
        '200':
          description: 更新后的标签
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /tags/{tagId}/sort:
    post:
      tags: [Tags]
      summary: 调整标签排序
      parameters:
        - $ref: '#/components/parameters/TagId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SortRequest'
      responses:
        '204':
          description: 排序成功
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /tags/{tagId}/merge:
    post:
      tags: [Tags]
      summary: 合并标签
      description: 一级标签不可删除；合并操作必须明确目标标签并迁移关联活动。
      parameters:
        - $ref: '#/components/parameters/TagId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergeTagRequest'
      responses:
        '200':
          description: 合并结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTagMergeResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /tags/{tagId}/migrate:
    post:
      tags: [Tags]
      summary: 迁移标签关联活动
      parameters:
        - $ref: '#/components/parameters/TagId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MigrateTagRequest'
      responses:
        '200':
          description: 迁移结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMigrationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /tags/{tagId}/disable:
    post:
      tags: [Tags]
      summary: 停用标签
      parameters:
        - $ref: '#/components/parameters/TagId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisableRequest'
      responses:
        '200':
          description: 停用结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /game-types/{gameTypeId}:
    patch:
      tags: [GameTypes]
      summary: 编辑游戏类型
      parameters:
        - $ref: '#/components/parameters/GameTypeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGameTypeRequest'
      responses:
        '200':
          description: 更新后的游戏类型
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseGameType'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /game-types/{gameTypeId}/sort:
    post:
      tags: [GameTypes]
      summary: 调整游戏类型排序
      parameters:
        - $ref: '#/components/parameters/GameTypeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SortRequest'
      responses:
        '204':
          description: 排序成功
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /game-types/{gameTypeId}/disable:
