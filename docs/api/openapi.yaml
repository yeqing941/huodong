        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Sort:
      name: sort
      in: query
      schema:
        type: string
        enum: [created_at, updated_at, game_name, activity_name]
        default: created_at
    Order:
      name: order
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: desc
    ActivityId:
      name: activityId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ImportId:
      name: importId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReviewId:
      name: reviewId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TagId:
      name: tagId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GameTypeId:
      name: gameTypeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConfigId:
      name: configId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FailureId:
      name: failureId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LogId:
      name: logId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Unauthorized:
      description: 未认证或令牌无效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Forbidden:
      description: 无权限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Conflict:
      description: 状态冲突或重复资源
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    TooManyRequests:
      description: 请求过于频繁
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'

  schemas:
    LoginRequest:
      type: object
      required: [account, password]
      properties:
        account:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          minLength: 1
          format: password

    AuthSession:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Token 有效期，单位为秒
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      required: [id, name, role, status]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/UserStatus'
        last_login_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    Permission:
      type: object
      required: [code, description]
      properties:
        code:
          type: string
        description:
          type: string

    Role:
      type: string
      enum: [user, operator, admin]

    UserStatus:
      type: string
      enum: [active, disabled]

    Activity:
      type: object
      required: [id, source_url, source_site, game_name, game_type, activity_name, screenshots, tags, status, created_at, created_by]
      properties:
        id:
          type: string
          format: uuid
        source_url:
          type: string
          format: uri
        source_site:
          type: string
          enum: [game_ui, official_site, official_community, taptap, manual]
        game_name:
          type: string
        game_type:
          $ref: '#/components/schemas/GameType'
        activity_name:
          type: string
        activity_start:
          type: string
          format: date-time
          nullable: true
        activity_end:
          type: string
          format: date-time
          nullable: true
        screenshots:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ActivityScreenshot'
        tags:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TagSummary'
        description:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/ActivityStatus'
        collection_method:
          type: string
          enum: [crawler, manual, batch_import]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by:
          oneOf:
            - $ref: '#/components/schemas/User'
            - type: string
              enum: [system]
        is_favorited:
          type: boolean

    ActivityScreenshot:
      type: object
      required: [id, url, thumbnail_url, sort_order]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        thumbnail_url:
          type: string
          format: uri
        sort_order:
          type: integer
          minimum: 0

    ActivityStatus:
      type: string
      enum: [pending_tagging, pending_admin_review, active, archived]

    ActivityStats:
      type: object
      required: [total, active, archived, pending_tagging, pending_admin_review]
      properties:
        total:
          type: integer
          minimum: 0
        active:
          type: integer
          minimum: 0
        archived:
          type: integer
          minimum: 0
        pending_tagging:
          type: integer
          minimum: 0
        pending_admin_review:
          type: integer
          minimum: 0

    TagSummary:
      type: object
      required: [id, name, level]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        level:
          type: integer
          minimum: 1
          maximum: 3

    TagNode:
      allOf:
        - $ref: '#/components/schemas/TagSummary'
        - type: object
          required: [status, sort_order, activity_count, children]
          properties:
            parent_id:
              type: string
              format: uuid
              nullable: true
            description:
              type: string
              nullable: true
            ai_hints:
              type: array
              items:
                type: string
            status:
              type: string
              enum: [active, disabled]
            sort_order:
              type: integer
              minimum: 0
            activity_count:
              type: integer
              minimum: 0
            children:
              type: array
              items:
                $ref: '#/components/schemas/TagNode'

    GameType:
      type: object
      required: [id, name, status, sort_order, activity_count]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, disabled]
        sort_order:
          type: integer
          minimum: 0
        activity_count:
          type: integer
          minimum: 0

    AIReview:
      type: object
      required: [id, activity, status, candidates, created_at]
      properties:
        id:
          type: string
          format: uuid
        activity:
          $ref: '#/components/schemas/Activity'
        status:
          $ref: '#/components/schemas/AIReviewStatus'
        candidates:
          type: array
          minItems: 0
          maxItems: 3
          items:
            $ref: '#/components/schemas/AITagCandidate'
        selected_tag_ids:
          type: array
          maxItems: 3
          items:
            type: string
            format: uuid
        ai_error_code:
          type: string
          nullable: true
        ai_error_message:
          type: string
          nullable: true
        operator_comment:
          type: string
          nullable: true
        admin_comment:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AIReviewStatus:
      type: string
      enum: [pending_tagging, pending_operator_review, pending_admin_review, approved, returned]

    AITagCandidate:
      type: object
      required: [tag, confidence]
      properties:
        tag:
          $ref: '#/components/schemas/TagSummary'
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
        reason:
          type: string
          nullable: true

    CrawlerConfig:
      type: object
      required: [id, name, source_site, rule_summary, game_scope, schedule, status]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        source_site:
          type: string
        source_url:
          type: string
          format: uri
        rule_summary:
          type: string
        game_scope:
          type: array
          items:
            type: string
        schedule:
          type: string
          description: Cron 表达式或等价调度描述
        status:
          $ref: '#/components/schemas/CrawlerConfigStatus'
        consecutive_failure_count:
          type: integer
          minimum: 0
        last_run_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CrawlerConfigStatus:
      type: string
      enum: [enabled, disabled, auto_paused]

    CrawlerTask:
      type: object
      required: [id, config_id, source_site, game_scope, trigger_type, status, statistics, created_at]
      properties:
        id:
          type: string
          format: uuid
        config_id:
          type: string
          format: uuid
        source_site:
          type: string
        game_scope:
          type: array
          items:
            type: string
        trigger_type:
          $ref: '#/components/schemas/CrawlerTriggerType'
        triggered_by:
          oneOf:
            - $ref: '#/components/schemas/User'
            - type: string
              enum: [system]
        status:
          $ref: '#/components/schemas/CrawlerTaskStatus'
        stage:
          type: string
          nullable: true
        progress:
          type: integer
          minimum: 0
          maximum: 100
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        statistics:
          $ref: '#/components/schemas/CrawlerTaskStatistics'
        error_summary:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    CrawlerTriggerType:
      type: string
      enum: [scheduled, manual]

    CrawlerTaskStatus:
      type: string
      enum: [queued, running, completed, partial, failed, cancelled]

    CrawlerTaskStatistics:
      type: object
      required: [new_count, duplicate_count, failed_count, pending_tagging_count]
      properties:
        new_count:
          type: integer
          minimum: 0
        duplicate_count:
          type: integer
          minimum: 0
        failed_count:
          type: integer
          minimum: 0
        pending_tagging_count:
          type: integer
          minimum: 0

    CrawlerFailure:
      type: object
      required: [id, task_id, url, error_type, error_message, status, retry_count, created_at]
      properties:
        id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        error_type:
          type: string
          enum: [not_found, timeout, blocked, parse_error, unknown]
        error_message:
          type: string
        status:
          $ref: '#/components/schemas/CrawlerFailureStatus'
        retry_count:
          type: integer
          minimum: 0
        last_retried_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    CrawlerFailureStatus:
      type: string
      enum: [pending_retry, retrying, resolved, exhausted]

    AuditLog:
      type: object
      required: [id, actor, action, object_type, object_id, result, created_at]
      properties:
        id:
          type: string
          format: uuid
        actor:
          oneOf:
            - $ref: '#/components/schemas/User'
            - type: string
              enum: [system]
        action:
          type: string
        object_type:
          type: string
        object_id:
          type: string
        result:
          type: string
          enum: [success, failure]
        before_data:
          type: object
          additionalProperties: true
          nullable: true
        after_data:
          type: object
          additionalProperties: true
          nullable: true
        comment:
          type: string
          nullable: true
        created_at:
