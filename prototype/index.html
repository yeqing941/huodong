function activityFiltered(){return DB.activities.filter(a=>(state.filters.archived||!a.archived)&&(!state.filters.q||`${a.title}${a.game}`.includes(state.filters.q))&&(state.filters.genre==='全部'||a.genre===state.filters.genre)&&(state.filters.tag==='全部'||a.tags.includes(state.filters.tag)))}
function card(a){return `<article class="activity-card"><div onclick="openDetail(${a.id})" style="cursor:pointer">${gradient(a)}<div class="card-body"><button class="favorite ${a.fav?'on':''}" onclick="event.stopPropagation();toggleFav(${a.id})">${a.fav?'★':'☆'}</button><div class="card-title">${esc(a.title)}</div><div class="meta">${esc(a.game)} · ${esc(a.genre)} · ${a.time}${a.archived?' · 已归档':''}</div><div class="tags">${a.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div></div></div></article>`}
function library(){const list=activityFiltered();const types=DB.gameTypes.map(x=>x.name);const tags=[...new Set(DB.tagTree.flatMap(r=>r.children.flatMap(c=>c.children.map(x=>x.name))))];return `<div class="page-head"><div><div class="eyebrow">REFERENCE LIBRARY</div><h1 class="page-title">活动库</h1><p class="page-desc">按活动形式、游戏类型和游戏名称快速找到竞品参考</p></div><div class="actions">${roles[state.role].pages.includes('entry')?'<button class="btn primary" onclick="go(\'entry\')">＋ 新增活动</button>':''}</div></div><div class="toolbar"><input class="input search" placeholder="搜索游戏名称或活动名称" value="${esc(state.filters.q)}" oninput="setFilter('q',this.value)"><select class="select" onchange="setFilter('tag',this.value)"><option>全部</option>${tags.map(x=>`<option ${state.filters.tag===x?'selected':''}>${x}</option>`).join('')}</select><select class="select" onchange="setFilter('genre',this.value)"><option>全部</option>${types.map(x=>`<option ${state.filters.genre===x?'selected':''}>${x}</option>`).join('')}</select><button class="btn ghost" onclick="clearFilter()">清空筛选</button></div><div class="count-line"><span>共 ${list.length} 条活动参考</span><span>默认按最近入库排序</span></div>${list.length?`<div class="grid">${list.map(card).join('')}</div>`:`<div class="panel empty"><strong>没有找到匹配活动</strong><span>尝试清空筛选条件或更换搜索词</span><br><button class="btn primary" style="margin-top:15px" onclick="clearFilter()">清空筛选</button></div>`}`}
function favorites(){const list=DB.activities.filter(a=>a.fav);return `<div class="page-head"><div><div class="eyebrow">PERSONAL SPACE</div><h1 class="page-title">我的收藏</h1><p class="page-desc">收藏的活动参考会按最近收藏时间保留在这里</p></div></div>${list.length?`<div class="count-line"><span>已收藏 ${list.length} 条活动</span></div><div class="grid">${list.map(card).join('')}</div>`:`<div class="panel empty"><strong>还没有收藏活动</strong><span>在活动库中点击卡片右上角的星标即可收藏</span><br><button class="btn primary" style="margin-top:15px" onclick="go('library')">返回活动库</button></div>`}`}
function detailPage(){const a=DB.activities.find(x=>x.id===state.selected)||DB.activities[0];const canEdit=state.role==='超级管理员'||(state.role==='运营'&&a.owner===roles[state.role].name);return `<div class="page-head"><div><button class="btn ghost" onclick="go('library')">‹ 返回活动库</button><h1 class="page-title" style="margin-top:18px">${esc(a.title)}</h1><p class="page-desc">${esc(a.game)} · ${esc(a.genre)} · ${a.time}${a.archived?' · 已归档':''}</p></div><div class="actions"><button class="btn ${a.fav?'primary':''}" onclick="toggleFav(${a.id})">${a.fav?'★ 已收藏':'☆ 收藏'}</button>${canEdit?`<button class="btn" onclick="openEntry(${a.id})">编辑活动</button>`:''}${state.role==='超级管理员'?(a.archived?`<button class="btn" onclick="restoreActivity(${a.id})">恢复活动</button>`:`<button class="btn danger" onclick="archiveActivity(${a.id})">归档活动</button>`):''}</div></div><div class="detail"><div><div class="detail-image">${gradient(a)}</div><div class="thumbs">${[a,a,a].map((x,i)=>`<button class="thumb ${state.thumb===i?'active':''}" onclick="state.thumb=${i};render()">${gradient({...x,gradient:i===1?'v2':i===2?'v3':''})}</button>`).join('')}</div></div><div class="panel info-panel"><h2 class="section-title">活动信息</h2><div class="info-list"><span>游戏名称</span><strong>${esc(a.game)}</strong><span>游戏类型</span><strong>${esc(a.genre)}</strong><span>活动形式</span><strong>${a.tags.map(t=>`<span class="tag">${t}</span>`).join(' ')}</strong><span>采集方式</span><strong>${a.collected}</strong><span>录入人</span><strong>${esc(a.owner||'系统')}</strong><span>来源</span><strong style="color:var(--primary)">${a.source}</strong><span>来源 URL</span><strong style="color:var(--primary)">打开原始页面 ↗</strong><span>活动说明</span><strong>${esc(a.desc)}</strong></div><div class="notice">原型提示：来源 URL、截图和 AI 标签均使用模拟数据。</div></div></div><div style="margin-top:28px"><h2 class="section-title">相关活动</h2><div class="related">${DB.activities.filter(x=>x.id!==a.id&&!x.archived).slice(0,4).map(x=>`<div class="mini" onclick="openDetail(${x.id})">${gradient(x)}<div class="mini-body">${x.title}<div class="meta">${x.game}</div></div></div>`).join('')}</div></div>`}
function entry(){const a=state.editing?DB.activities.find(x=>x.id===state.editing):null;const types=DB.gameTypes.filter(x=>x.active);const tags=[...new Set(DB.tagTree.flatMap(r=>r.children.flatMap(c=>c.children.map(x=>x.name))))];const body=state.entryTab==='batch'&&!a?batchEntry():`<div class="panel" style="padding:24px;max-width:900px"><div class="form-grid"><div class="field"><label>活动名称 *</label><input id="f-title" class="input" value="${esc(a?.title||'')}" placeholder="例如：周年庆登录奖励"></div><div class="field"><label>游戏名称 *</label><input id="f-game" class="input" value="${esc(a?.game||'')}" placeholder="例如：原神"></div><div class="field"><label>游戏类型 *</label><select id="f-genre" class="select">${types.map(t=>`<option ${a?.genre===t.name?'selected':''}>${t.name}</option>`).join('')}</select></div><div class="field"><label>活动时间</label><input id="f-time" class="input" value="${esc(a?.time||'2026-10-18 至 2026-11-01')}"></div><div class="field full"><label>活动形式标签 *（可多选，已有标签可取消）</label><div id="f-tags" class="tags">${tags.map(t=>`<button type="button" class="tag ${a?.tags.includes(t)?'green':''}" data-tag="${t}" onclick="this.classList.toggle('green')">${t}</button>`).join('')}</div></div><div class="field"><label>来源 URL</label><input id="f-source" class="input" value="${esc(a?.source||'手动录入')}"></div><div class="field full"><label>活动描述</label><textarea id="f-desc" class="textarea" placeholder="简要记录活动机制和界面特点">${esc(a?.desc||'')}</textarea></div><div class="field full"><label>活动截图 *</label><div class="panel" style="padding:22px;text-align:center;color:var(--muted);border-style:dashed">${a?'已保留原活动截图':'点击上传截图（原型阶段使用预设截图）'}<br><button class="btn" style="margin-top:10px" onclick="toast('已模拟上传 1 张截图')">选择文件</button></div></div></div><div class="modal-actions"><button class="btn" onclick="go('library')">取消</button><button class="btn primary" onclick="saveEntry()">保存活动</button></div></div>`;return `<div class="page-head"><div><div class="eyebrow">CONTENT INTAKE</div><h1 class="page-title">活动录入</h1><p class="page-desc">${a?'编辑活动并保留原有标签与游戏类型':'补充一条活动参考，保存后将直接进入正式活动库'}</p></div></div><div class="subtabs"><button class="active">${a?'编辑活动':'单条录入'}</button><button onclick="state.editing=null;state.entryTab='batch';render()">批量录入</button></div>${body}`;
}
function tasks(){return `<div class="page-head"><div><div class="eyebrow">COLLECTION WORKSPACE</div><h1 class="page-title">爬虫任务</h1><p class="page-desc">运营可触发已配置来源，查看结果并重试失败记录</p></div><div class="actions"><button class="btn primary" onclick="openCrawl()">＋ 手动触发爬虫</button></div></div><div class="stats"><div class="stat"><div class="stat-label">本周新增</div><div class="stat-value">53</div></div><div class="stat"><div class="stat-label">待打标</div><div class="stat-value">4</div></div><div class="stat"><div class="stat-label">失败记录</div><div class="stat-value" style="color:var(--danger)">10</div></div><div class="stat"><div class="stat-label">运行中任务</div><div class="stat-value" style="color:var(--success)">${state.taskRunning?'1':'0'}</div></div></div><div class="panel table-wrap"><table class="table"><thead><tr><th>任务编号</th><th>来源</th><th>游戏范围</th><th>进度</th><th>状态</th><th>结果</th><th>操作</th></tr></thead><tbody>${DB.tasks.map(t=>`<tr><td><strong>${t.id}</strong></td><td>${t.source}</td><td>${t.scope}</td><td>${t.progress||0}%<div style="color:var(--muted);font-size:11px">${t.stage||'等待执行'}</div></td><td><span class="status ${t.status==='已完成'?'success':t.status==='失败'?'danger':'warning'}">${t.status}</span></td><td>新增 ${t.new} / 重复 ${t.dup} / 失败 ${t.fail} / 待打标 ${t.pending}</td><td><button class="btn" onclick="openTask('${t.id}')">查看详情</button> <button class="btn" onclick="retryTask('${t.id}')">重试</button></td></tr>`).join('')}</tbody></table></div>`}
function reviews(){return `<div class="page-head"><div><div class="eyebrow">AI QUALITY REVIEW</div><h1 class="page-title">AI 待审核</h1><p class="page-desc">运营完成初审后提交管理员确认，管理员保留最终修正权</p></div></div><div class="notice">当前有 ${DB.reviews.length} 条低置信度活动。AI 只从已有标签树中给出候选，不会创建新标签。</div><div class="grid">${DB.reviews.map(r=>`<article class="activity-card"><div>${gradient({gradient:r.gradient})}<div class="card-body"><div class="card-title">${r.title}</div><div class="meta">${r.game} · AI 置信度 ${r.confidence}</div><div class="tags">${r.candidate.map(t=>`<span class="tag orange">${t}</span>`).join('')}</div><div style="margin-top:14px;display:flex;gap:7px;flex-wrap:wrap"><button class="btn primary" onclick="reviewAction(${r.id},'submit')">${state.role==='超级管理员'?'最终确认':'提交管理员确认'}</button><button class="btn" onclick="reviewAction(${r.id},'edit')">修正标签</button></div></div></div></article>`).join('')}</div>`}
function tags(){const treeRows=[];DB.tagTree.forEach(l1=>{treeRows.push({node:l1,level:1});(l1.children||[]).forEach(l2=>{treeRows.push({node:l2,level:2});(l2.children||[]).forEach(l3=>treeRows.push({node:l3,level:3}))})});return `<div class="page-head"><div><div class="eyebrow">TAXONOMY</div><h1 class="page-title">标签与类型管理</h1><p class="page-desc">维护三级活动形式标签和启用中的游戏类型</p></div><div class="actions">${state.adminTab==='tags'?'<button class="btn primary" onclick="openTagEditor()">＋ 新增标签</button>':'<button class="btn primary" onclick="openGameTypeEditor()">＋ 新增游戏类型</button>'}</div></div><div class="subtabs"><button class="${state.adminTab==='tags'?'active':''}" onclick="state.adminTab='tags';render()">活动形式标签</button><button class="${state.adminTab==='types'?'active':''}" onclick="state.adminTab='types';render()">游戏类型</button></div>${state.adminTab==='tags'?`<div class="panel tree">${treeRows.map(({node,level})=>`<div class="tree-row level-${level}"><div><span class="tree-name">${esc(node.name)}</span><span class="tree-meta">　${level} 级 · ${node.count} 条活动</span></div><div><button class="btn" onclick="openTagEditor(${node.id})">编辑</button>${level<3?` <button class="btn" onclick="openTagEditor(null,${node.id})">新增下级</button>`:''}</div></div>`).join('')}</div>`:`<div class="panel table-wrap"><table class="table"><thead><tr><th>游戏类型</th><th>说明</th><th>关联活动</th><th>状态</th><th>操作</th></tr></thead><tbody>${DB.gameTypes.map((t,i)=>`<tr><td><strong>${esc(t.name)}</strong></td><td>${esc(t.desc)}</td><td>${t.count}</td><td><span class="status ${t.active?'success':'warning'}">${t.active?'启用':'已停用'}</span></td><td><button class="btn" onclick="openGameTypeEditor(${i})">编辑</button> <button class="btn" onclick="toggleGameType(${i})">${t.active?'停用':'启用'}</button></td></tr>`).join('')}</tbody></table></div>`}`}
function configs(){return `<div class="page-head"><div><div class="eyebrow">SOURCE CONFIGURATION</div><h1 class="page-title">爬虫配置</h1><p class="page-desc">仅超级管理员可管理来源、规则和调度频率</p></div><div class="actions"><button class="btn primary" onclick="toast('原型阶段：配置创建已模拟')">＋ 新增来源</button></div></div><div class="panel table-wrap"><table class="table"><thead><tr><th>来源站点</th><th>规则摘要</th><th>游戏范围</th><th>频率</th><th>状态</th><th>操作</th></tr></thead><tbody>${DB.configs.map(c=>`<tr><td><strong>${c[0]}</strong></td><td>${c[1]}</td><td>${c[2]}</td><td>${c[3]}</td><td><span class="status ${c[4]==='运行中'?'success':'warning'}">${c[4]}</span></td><td><button class="btn" onclick="toast('已打开来源配置抽屉')">编辑</button> <button class="btn" onclick="toast('状态已模拟切换')">${c[4]==='运行中'?'暂停':'启用'}</button></td></tr>`).join('')}</tbody></table></div>`}
function users(){return `<div class="page-head"><div><div class="eyebrow">TEAM ACCESS</div><h1 class="page-title">用户与权限</h1><p class="page-desc">管理成员角色与账号状态</p></div><div class="actions"><button class="btn primary" onclick="toast('原型阶段：新增用户已模拟')">＋ 新增用户</button></div></div><div class="panel table-wrap"><table class="table"><thead><tr><th>成员</th><th>角色</th><th>状态</th><th>最近登录</th><th>操作</th></tr></thead><tbody>${DB.users.map(u=>`<tr><td><strong>${u.name}</strong></td><td><span class="tag gray">${u.role}</span></td><td><span class="status success">${u.status}</span></td><td>${u.last}</td><td><button class="btn" onclick="toast('已打开成员编辑抽屉')">编辑角色</button> <button class="btn" onclick="toast('账号状态已模拟切换')">停用</button></td></tr>`).join('')}</tbody></table></div>`}
function logs(){return `<div class="page-head"><div><div class="eyebrow">AUDIT TRAIL</div><h1 class="page-title">操作日志</h1><p class="page-desc">关键采集、审核、标签和权限操作均保留记录</p></div></div><div class="toolbar"><input class="input" placeholder="搜索操作者或对象" style="flex:1"><select class="select"><option>全部动作</option><option>爬虫任务</option><option>AI 审核</option><option>标签管理</option></select><button class="btn" onclick="toast('筛选条件已应用')">筛选</button></div><div class="panel table-wrap"><table class="table"><thead><tr><th>时间</th><th>操作者</th><th>角色</th><th>对象</th><th>动作</th><th>结果</th></tr></thead><tbody>${DB.logs.map(l=>`<tr><td>${l[0]}</td><td>${l[1]}</td><td>${l[2]}</td><td>${l[3]}</td><td>${l[4]}</td><td><span class="status success">${l[5]}</span></td></tr>`).join('')}</tbody></table></div>`}
const pages={library,favorites,entry,tasks,reviews,tags,configs,users,logs};
function setFilter(k,v){state.filters[k]=v;render()}function clearFilter(){state.filters={q:'',genre:'全部',tag:'全部',archived:false};render()}function openDetail(id){state.selected=id;state.page='detail';render()}function toggleFav(id){const a=DB.activities.find(x=>x.id===id);a.fav=!a.fav;render();toast(a.fav?'已加入收藏':'已取消收藏')}function toast(msg){const el=document.getElementById('toast');el.innerHTML=`<div class="toast">${msg}</div>`;setTimeout(()=>el.innerHTML='',2400)}
function openEntry(id){state.editing=id||null;state.entryTab='single';state.page='entry';render()}
function batchEntry(){return `<div class="panel" style="padding:24px;max-width:900px"><div class="notice">原型阶段使用预设导入结果，不解析真实 CSV/Excel 文件。</div><div class="field"><label>选择 CSV/Excel 文件</label><div class="panel" style="padding:24px;text-align:center;border-style:dashed;color:var(--muted)"><button class="btn" onclick="previewBatch()">选择文件</button><div style="margin-top:10px">示例：活动参考批量录入.xlsx</div></div></div>${state.batchPreview?`<div style="margin-top:22px"><h2 class="section-title">导入预览</h2><div class="stats"><div class="stat"><div class="stat-label">有效记录</div><div class="stat-value" style="color:var(--success)">2</div></div><div class="stat"><div class="stat-label">问题记录</div><div class="stat-value" style="color:var(--danger)">1</div></div></div><div class="panel table-wrap"><table class="table"><thead><tr><th>活动名称</th><th>游戏</th><th>游戏类型</th><th>标签</th><th>校验结果</th></tr></thead><tbody><tr><td>冬日签到礼</td><td>原神</td><td>二次元</td><td>签到</td><td><span class="status success">有效</span></td></tr><tr><td>赛季任务奖励</td><td>王者荣耀</td><td>MOBA</td><td>任务</td><td><span class="status success">有效</span></td></tr><tr><td>未命名活动</td><td>明日方舟</td><td>卡牌</td><td>未知标签</td><td><span class="status danger">活动名称缺失 / 标签不存在</span></td></tr></tbody></table></div><div class="modal-actions"><button class="btn" onclick="state.batchPreview=false;render()">重新选择</button><button class="btn primary" onclick="importBatch()">导入 2 条有效记录</button></div></div>`:''}</div>`}
function previewBatch(){state.batchPreview=true;render();toast('已生成预览：2 条有效，1 条问题记录')}
function importBatch(){DB.activities.unshift({id:Date.now(),title:'冬日签到礼',game:'原神',genre:'二次元',tags:['签到'],source:'批量导入',time:'今天',gradient:'v2',collected:'人工录入',owner:roles[state.role].name,archived:false,fav:false,desc:'批量导入的活动记录。'},{id:Date.now()+1,title:'赛季任务奖励',game:'王者荣耀',genre:'MOBA',tags:['任务'],source:'批量导入',time:'今天',gradient:'v4',collected:'人工录入',owner:roles[state.role].name,archived:false,fav:false,desc:'批量导入的活动记录。'});state.batchPreview=false;state.entryTab='single';state.page='library';render();toast('已导入 2 条有效记录，问题记录未导入')}
function saveEntry(){const title=document.getElementById('f-title')?.value.trim();const game=document.getElementById('f-game')?.value.trim();const tags=[...document.querySelectorAll('#f-tags .green')].map(x=>x.dataset.tag);if(!title||!game||!tags.length){toast('请填写活动名称、游戏名称并至少选择一个标签');return}const data={title,game,genre:document.getElementById('f-genre').value,tags,source:document.getElementById('f-source').value.trim()||'手动录入',time:document.getElementById('f-time').value.trim()||'今天',desc:document.getElementById('f-desc').value.trim()||'原型阶段新增的活动记录。'};if(state.editing){const a=DB.activities.find(x=>x.id===state.editing);Object.assign(a,data);toast('活动已更新，原有记录已保留')}else{DB.activities.unshift({id:Date.now(),...data,gradient:'v6',collected:'人工录入',owner:roles[state.role].name,archived:false,fav:false});toast('活动已保存并进入活动库')}state.editing=null;state.page='library';render()}
function archiveActivity(id){const a=DB.activities.find(x=>x.id===id);document.getElementById('overlay').innerHTML=`<div class="modal-backdrop"><div class="modal"><div class="modal-head"><h2 class="section-title">确认归档活动</h2><button class="close" onclick="closeOverlay()">×</button></div><p>归档后活动将从正常活动库隐藏，超级管理员仍可恢复。</p><div class="field"><label>归档原因</label><textarea id="archive-reason" class="textarea" placeholder="例如：来源污染或采集错误"></textarea></div><div class="modal-actions"><button class="btn" onclick="closeOverlay()">取消</button><button class="btn danger" onclick="confirmArchive(${id})">确认归档</button></div></div></div>`}
function confirmArchive(id){const a=DB.activities.find(x=>x.id===id);a.archived=true;a.archiveReason=document.getElementById('archive-reason').value.trim()||'未填写';closeOverlay();render();toast('活动已归档')}
function restoreActivity(id){const a=DB.activities.find(x=>x.id===id);a.archived=false;render();toast('活动已恢复到正常活动库')}

function openCrawl(){document.getElementById('overlay').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeOverlay()"><div class="modal"><div class="modal-head"><h2 class="section-title">手动触发爬虫</h2><button class="close" onclick="closeOverlay()">×</button></div><div class="notice">运营只能使用超级管理员已配置的来源，不能修改爬虫规则或频率。</div><div class="form-grid"><div class="field"><label>来源站点</label><select class="select"><option>官方官网</option><option>官方社区</option><option>Game UI</option></select></div><div class="field"><label>游戏范围</label><select class="select"><option>原神、王者荣耀</option><option>明日方舟、蛋仔派对</option></select></div></div><div class="modal-actions"><button class="btn" onclick="closeOverlay()">取消</button><button class="btn primary" onclick="triggerCrawl()">开始采集</button></div></div></div>`}
function triggerCrawl(){closeOverlay();state.taskRunning=true;render();toast('任务已启动，正在执行预设采集结果');setTimeout(()=>{state.taskRunning=false;const task={id:'CR-20261017-019',source:'官方官网',scope:'原神、王者荣耀',status:'部分完成',time:'刚刚',new:8,dup:16,fail:1,pending:2,progress:76,stage:'失败记录待重试',failures:[{url:'https://official.example.com/genshin/event-103',reason:'页面响应超时',status:'待重试'}]};DB.tasks.unshift(task);DB.reviews.unshift({id:Date.now(),title:'周年庆任务奖励',game:'原神',confidence:'64%',candidate:['任务','登录奖励'],state:'待运营初审',gradient:'v3'});render();toast('采集完成：新增 8 条，1 条失败，2 条待打标')},1200)}
function openTask(id){const t=DB.tasks.find(x=>x.id===id);document.getElementById('overlay').innerHTML=`<div class="drawer" onclick="if(event.target===this)closeOverlay()"><div class="drawer-panel"><div class="modal-head"><h2 class="section-title">任务详情</h2><button class="close" onclick="closeOverlay()">×</button></div><div class="notice">${t.status} · ${t.time} · ${t.progress||0}%</div><div class="info-list"><span>任务编号</span><strong>${t.id}</strong><span>来源</span><strong>${t.source}</strong><span>游戏范围</span><strong>${t.scope}</strong><span>当前阶段</span><strong>${t.stage||'已完成'}</strong><span>新增</span><strong>${t.new} 条</strong><span>重复</span><strong>${t.dup} 条</strong><span>失败</span><strong>${t.fail} 条</strong><span>待打标</span><strong>${t.pending} 条</strong></div>${t.failures?.length?`<h3 class="section-title">失败记录</h3><div class="panel" style="padding:10px">${t.failures.map((f,i)=>`<div style="padding:12px 0;border-bottom:1px solid var(--line)"><div style="font-size:12px;word-break:break-all">${esc(f.url)}</div><div class="meta">${esc(f.reason)} · ${f.status}</div><button class="btn" style="margin-top:8px" onclick="retryFailure('${t.id}',${i})">单条重试</button></div>`).join('')}</div>`:'<div class="notice">暂无失败 URL，任务结果可直接进入 AI 待审核。</div>'}<div class="modal-actions"><button class="btn" onclick="closeOverlay();go('reviews')">进入 AI 待审核</button><button class="btn primary" onclick="retryTask('${t.id}')">重试失败记录</button></div></div></div>`}
function retryFailure(taskId,index){const t=DB.tasks.find(x=>x.id===taskId);if(t.failures?.[index]){t.failures[index].status='已重试';t.fail=Math.max(0,t.fail-1);t.progress=Math.min(100,t.progress+8);t.stage=t.fail?'失败记录待重试':'已完成';if(!t.fail) t.status='已完成';closeOverlay();render();toast('失败记录已重试并更新任务结果')}}
function retryTask(id){const t=DB.tasks.find(x=>x.id===id);if(t.failures?.length){t.failures.forEach(f=>f.status='已重试');t.fail=0;t.progress=100;t.stage='已完成';t.status='已完成';render();toast(`已完成 ${id} 的失败记录重试`)}else toast(`任务 ${id} 没有可重试失败记录`)}function reviewAction(id,action){if(action==='edit'){toast('已打开标签修正控件');return}if(state.role==='运营'){DB.reviews=DB.reviews.filter(r=>r.id!==id);toast('初审结果已提交，等待超级管理员确认')}else{DB.reviews=DB.reviews.filter(r=>r.id!==id);toast('标签已最终确认，活动进入正式库')}render()}
function openTagEditor(id=null,parentId=null){const node=id?findTag(id):null;const level=node?.level||((findTag(parentId)?.level||0)+1);if(level>3){toast('标签树最多支持三级');return}document.getElementById('overlay').innerHTML=`<div class="modal-backdrop"><div class="modal"><div class="modal-head"><h2 class="section-title">${node?'编辑标签':'新增标签'}</h2><button class="close" onclick="closeOverlay()">×</button></div><div class="form-grid"><div class="field"><label>标签名称</label><input id="tag-name" class="input" value="${esc(node?.name||'')}"></div><div class="field"><label>层级</label><input class="input" value="${level} 级${parentId?'（已选择父级）':''}" disabled></div></div><div class="modal-actions"><button class="btn" onclick="closeOverlay()">取消</button><button class="btn primary" onclick="saveTag(${id||'null'},${parentId||'null'},${level})">保存</button></div></div></div>`}
function findTag(id,nodes=DB.tagTree){for(const node of nodes){if(node.id===id)return node;const found=findTag(id,node.children||[]);if(found)return found}return null}
function saveTag(id,parentId,level){const name=document.getElementById('tag-name').value.trim();if(!name){toast('请输入标签名称');return}if(id){findTag(id).name=name}else if(level===1){DB.tagTree.push({id:Date.now(),name,level:1,parent:null,count:0,children:[]})}else{const parent=findTag(parentId);parent.children=parent.children||[];parent.children.push({id:Date.now(),name,level,parent:parentId,count:0,...(level===2?{children:[]}:{})})}closeOverlay();render();toast('标签已保存')}
function openGameTypeEditor(index=null){const t=index===null?null:DB.gameTypes[index];document.getElementById('overlay').innerHTML=`<div class="modal-backdrop"><div class="modal"><div class="modal-head"><h2 class="section-title">${t?'编辑游戏类型':'新增游戏类型'}</h2><button class="close" onclick="closeOverlay()">×</button></div><div class="field"><label>类型名称</label><input id="type-name" class="input" value="${esc(t?.name||'')}"></div><div class="field" style="margin-top:12px"><label>类型说明</label><input id="type-desc" class="input" value="${esc(t?.desc||'')}"></div><div class="modal-actions"><button class="btn" onclick="closeOverlay()">取消</button><button class="btn primary" onclick="saveGameType(${index===null?'null':index})">保存</button></div></div></div>`}
function saveGameType(index){const name=document.getElementById('type-name').value.trim();const desc=document.getElementById('type-desc').value.trim();if(!name){toast('请输入游戏类型名称');return}if(index===null)DB.gameTypes.push({name,desc,active:true,count:0});else Object.assign(DB.gameTypes[index],{name,desc});closeOverlay();render();toast('游戏类型已保存')}
function toggleGameType(index){const t=DB.gameTypes[index];t.active=!t.active;render();toast(`${t.name} 已${t.active?'启用':'停用'}`)}
function closeOverlay(){document.getElementById('overlay').innerHTML=''}
function login(){const u=document.getElementById('login-user').value.trim();const p=document.getElementById('login-pass').value.trim();if(u&&p){state.page='library';render()}else document.getElementById('login-error').textContent='请输入演示账号和密码'}
function showLogin(){document.getElementById('root').innerHTML=`<div class="login-wrap"><div class="login"><div class="eyebrow">GAME ACTIVITY REFERENCE</div><h1>活动参考库</h1><p>收集、筛选和复用竞品活动界面参考</p><div class="field"><label>账号</label><input id="login-user" class="input" placeholder="演示账号：admin"></div><div class="field"><label>密码</label><input id="login-pass" type="password" class="input" placeholder="演示密码：1234"></div><div id="login-error" style="color:var(--danger);font-size:12px;height:20px"></div><button class="btn primary" style="width:100%" onclick="login()">登录体验</button><div class="login-note">原型演示 · V0.1 · 无真实账号系统</div></div></div>`}
showLogin();
</script>
</body>
</html>
